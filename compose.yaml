version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: bank_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: bank_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  bankservice:
    build:
      context: ./backend/bankService
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: bank_bankservice
    environment:
      # Database
      BANK_DB_CONTAINER_NAME: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE}

      # Open Banking APIs
      VBANK_API_URL: ${VBANK_API_URL}
      VBANK_API_KEY: ${VBANK_API_KEY}
      TBANK_API_URL: ${TBANK_API_URL}
      TBANK_API_KEY: ${TBANK_API_KEY}
      SBERBANK_API_URL: ${SBERBANK_API_URL}
      SBERBANK_API_KEY: ${SBERBANK_API_KEY}

      # Logging
      LOGGING_LEVEL_COM_BANK: ${LOGGING_LEVEL_COM_BANK}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/bankService/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
