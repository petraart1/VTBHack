services:
  auth-db:
    image: 'postgres:16-alpine'

    container_name: auth-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - auth_db_data:/var/lib/postgresql/data:rw

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 3s
      retries: 3

  bank-db:
    image: 'postgres:16-alpine'

    container_name: bank-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - bank_db_data:/var/lib/postgresql/data:rw

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 3s
      retries: 3

  radar-db:
    image: 'postgres:16-alpine'

    container_name: radar-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - radar_db_data:/var/lib/postgresql/data:rw

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 3s
      retries: 3

  auth:
    container_name: auth

    build:
      context: ./authService
      dockerfile: Dockerfile

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: ${DB_PORT}
      AUTH_DB_CONTAINER_NAME: ${AUTH_DB_CONTAINER_NAME}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8080:8080"

    depends_on:
      auth-db:
        condition: service_healthy

  bank:
    container_name: bank

    build:
      context: ./bankService
      dockerfile: Dockerfile

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: ${DB_PORT}
      BANK_DB_CONTAINER_NAME: ${CHAT_DB_CONTAINER_NAME}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8081:8080"

    depends_on:
      bank-db:
        condition: service_healthy

  radar:
    container_name: radar

    build:
      context: ./radarService
      dockerfile: Dockerfile

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: ${DB_PORT}
      RADAR_DB_CONTAINER_NAME: ${MESSAGE_DB_CONTAINER_NAME}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8082:8080"

    depends_on:
      radar-db:
        condition: service_healthy

  nginx:
    container_name: nginx

    build:
      context: _infrastructure/nginx
      dockerfile: Dockerfile

    ports:
      - "80:80"

    depends_on:
      - auth
      - chat
      - message
      - user

volumes:
  auth_db_data:
  bank_db_data:
  radar_db_data:

networks:
  monitoring_net:
    driver: bridge