---
- name: Deploy Backend Services with 3 DBs
  hosts: production
  gather_facts: yes
  
  vars_files:
    - ../inventory/group_vars/vault.yaml

  pre_tasks:
    - name: Display deployment info
      debug:
        msg: |
          🚀 Deploying Backend Services
          Host: {{ inventory_hostname }}
          Deploy dir: {{ deploy_dir }}
          
          Services:
          - Auth: {{ authservice_version }}
          - Bank: {{ bankservice_version }}
          - Radar: {{ radarservice_version }}

    - name: Check Docker
      command: docker --version
      changed_when: false

  tasks:
    - name: Create deployment directories
      file:
        path: "{{ deploy_dir }}/{{ item }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0755'
      loop:
        - auth-db-data
        - bank-db-data
        - radar-db-data
        - redis-data
        - prometheus-data
        - logs/auth
        - logs/bank
        - logs/radar

    - name: Copy docker-compose.yml
      template:
        src: ../templates/docker-compose.prod.j2
        dest: "{{ deploy_dir }}/docker-compose.yml"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0644'

    - name: Create .env file
      template:
        src: ../templates/env.j2
        dest: "{{ deploy_dir }}/.env"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0600'
      no_log: true

    - name: Log in to GitHub Container Registry
      shell: |
        echo "{{ registry_password }}" | docker login -u {{ registry_username }} --password-stdin {{ registry_url }}
      become_user: "{{ deploy_user }}"
      no_log: true
      changed_when: false

    - name: Pull Docker images for microservices
      shell: |
        docker pull {{ registry_url }}/{{ registry_prefix }}/{{ item }}:{{ hostvars[inventory_hostname][item + '_version'] }}
      become_user: "{{ deploy_user }}"
      loop:
        - authservice
        - bankservice
        - radarservice

    - name: Recreate only microservice containers (no DBs)
      shell: |
        cd {{ deploy_dir }}
        docker compose up -d --no-deps --force-recreate --remove-orphans auth bank radar
      become_user: "{{ deploy_user }}"
      environment:
        COMPOSE_PROJECT_NAME: "{{ compose_project_name }}"
      register: recreate_result

    - name: Wait for microservices to become healthy
      vars:
        services:
          - auth
          - bank
          - radar
      ansible.builtin.shell: |
        STATUS=$(docker inspect --format='{{.State.Health.Status}}' {{ item }})
        if [ "$STATUS" != "healthy" ]; then
          exit 1
        fi
      register: result
      retries: 30
      delay: 5
      until: result.rc == 0
      loop: "{{ services }}"
      loop_control:
      label: "{{ item }}"



    - name: Get container status
      shell: "cd {{ deploy_dir }} && docker compose ps"
      become_user: "{{ deploy_user }}"
      register: container_status
      changed_when: false

    - name: Display container status
      debug:
        var: container_status.stdout_lines

  post_tasks:
    - name: Deployment summary
      debug:
        msg: |
          ✅ Deployment successful!
          Services are running internally (proxied by Nginx).

          Internal endpoints:
          - Auth: authservice:8080
          - Bank: bankservice:8080
          - Radar: radarservice:8080
