---
- name: Deploy Backend Services with 3 DBs
  hosts: production
  gather_facts: yes
  
  vars_files:
    - ../inventory/group_vars/vault.yaml

  pre_tasks:
    - name: Display deployment info
      debug:
        msg: |
          🚀 Deploying Backend Services
          Host: {{ inventory_hostname }}
          Deploy dir: {{ deploy_dir }}
          
          Services:
          - Auth: {{ authservice_version }}
          - Bank: {{ bankservice_version }}
          - Radar: {{ radarservice_version }}

    - name: Check Docker
      command: docker --version
      changed_when: false

  tasks:
    - name: Create deployment directories
      file:
        path: "{{ deploy_dir }}/{{ item }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0755'
      loop:
        - auth-db-data
        - bank-db-data
        - radar-db-data
        - redis-data
        - prometheus-data
        - logs/auth
        - logs/bank
        - logs/radar
    
    - name: Remove old docker-compose.yml
      file:
        path: "{{ deploy_dir }}/docker-compose.yml"
        state: absent
      become_user: "{{ deploy_user }}"
      
    - name: Copy docker-compose.yml
      template:
        src: ../templates/docker-compose.prod.j2
        dest: "{{ deploy_dir }}/docker-compose.yml"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0644'

    - name: Create .env file
      template:
        src: ../templates/env.j2
        dest: "{{ deploy_dir }}/.env"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0600'
      no_log: true

    - name: Log in to GitHub Container Registry
      shell: |
        echo "{{ registry_password }}" | docker login -u {{ registry_username }} --password-stdin {{ registry_url }}
      become_user: "{{ deploy_user }}"
      no_log: true
      changed_when: false

    - name: Pull Docker images
      shell: |
        docker pull {{ registry_url }}/{{ registry_prefix }}/{{ item }}:{{ hostvars[inventory_hostname][item + '_version'] }}
      become_user: "{{ deploy_user }}"
      loop:
        - authservice
        - bankservice
        - radarservice
      ignore_errors: yes

    - name: Stop old containers
      shell: |
        cd {{ deploy_dir }}
        docker compose down --timeout 30 2>/dev/null || true
      become_user: "{{ deploy_user }}"
      environment:
        COMPOSE_PROJECT_NAME: "{{ compose_project_name }}"
      ignore_errors: yes

    - name: Start new containers
      shell: |
        cd {{ deploy_dir }}
        docker compose up -d --remove-orphans --force-recreate
      become_user: "{{ deploy_user }}"
      environment:
        COMPOSE_PROJECT_NAME: "{{ compose_project_name }}"
      register: up_result

    - name: Wait for services
      uri:
        url: "http://localhost:{{ item }}/actuator/health"
        method: GET
        status_code: 200
      retries: 30
      delay: 2
      until: uri_result.status == 200
      loop:
        - "{{ auth_port }}"
        - "{{ bank_port }}"
        - "{{ radar_port }}"
      ignore_errors: yes
      register: uri_result

    - name: Get container status
      shell: "cd {{ deploy_dir }} && docker compose ps"
      become_user: "{{ deploy_user }}"
      register: container_status
      changed_when: false

    - name: Display status
      debug:
        var: container_status.stdout_lines

  post_tasks:
    - name: Success message
      debug:
        msg: |
          ✅ Deployment successful!
          
          Services:
          - Auth: http://{{ ansible_host }}:{{ auth_port }}/actuator/health
          - Bank: http://{{ ansible_host }}:{{ bank_port }}/actuator/health
          - Radar: http://{{ ansible_host }}:{{ radar_port }}/actuator/health
