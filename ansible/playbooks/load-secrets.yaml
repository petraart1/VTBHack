---
- name: Load secrets into HashiCorp Vault
  hosts: production, staging
  become: yes
  vars_files:
    - ../inventory/group_vars/vault.yaml

  vars_prompt:
    - name: vault_token
      prompt: "Enter Vault root token"
      private: yes

  tasks:
    - name: Check Vault status
      uri:
        url: "http://localhost:8200/v1/sys/health"
        method: GET
        status_code: 200

    - name: Enable KV secrets engine
      uri:
        url: "http://localhost:8200/v1/sys/mounts/secret"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
        body_format: json
        body:
          type: "kv"
          options:
            version: "2"
        status_code: [200, 204, 400]  # 400 if already exists

    - name: Load {{ environment }} secrets into Vault
      uri:
        url: "http://localhost:8200/v1/secret/data/bankservice/{{ environment }}"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
        body_format: json
        body:
          data:
            jwt_secret: "{{ vault_jwt_secret }}"
            db_url: "{{ vault_db_url }}"
            db_user: "{{ vault_db_user }}"
            db_password: "{{ vault_db_password }}"
            redis_password: "{{ vault_redis_password }}"
            vbank_api_url: "{{ vault_vbank_api_url }}"
            vbank_api_key: "{{ vault_vbank_api_key }}"
            tbank_api_url: "{{ vault_tbank_api_url }}"
            tbank_api_key: "{{ vault_tbank_api_key }}"
            sberbank_api_url: "{{ vault_sberbank_api_url }}"
            sberbank_api_key: "{{ vault_sberbank_api_key }}"
        status_code: 200

    - name: Verify secrets loaded
      uri:
        url: "http://localhost:8200/v1/secret/data/bankservice/{{ environment }}"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_token }}"
        status_code: 200
      register: secrets_check

    - name: Display loaded secrets
      debug:
        msg: "✅ Secrets loaded successfully for {{ environment }} environment"
