---
- name: Initial Server Setup for BankService
  hosts: all
  become: yes

  vars:
    docker_compose_version: "2.24.0"
    deploy_user: deploy

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
          - ufw
          - htop
          - vim
          - git
        state: present
        update_cache: yes

    - name: Create deploy user
      user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        groups: sudo
        append: yes
        create_home: yes

    - name: Set up authorized keys for deploy user
      authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"
        state: present

    - name: Allow deploy user to have passwordless sudo
      lineinfile:
        path: /etc/sudoers.d/{{ deploy_user }}
        line: "{{ deploy_user }} ALL=(ALL) NOPASSWD: ALL"
        state: present
        create: yes
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Add deploy user to docker group
      user:
        name: "{{ deploy_user }}"
        groups: docker
        append: yes

    - name: Enable Docker service
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Verify Docker Compose installation
      command: docker-compose --version
      register: compose_version

    - name: Display Docker Compose version
      debug:
        var: compose_version.stdout

    - name: Configure UFW defaults
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: 'incoming', policy: 'deny' }
        - { direction: 'outgoing', policy: 'allow' }

    - name: Configure UFW rules for backend
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"     # SSH
        - "8081"   # BankService

    - name: Enable UFW
      ufw:
        state: enabled

    - name: Create deployment directory
      file:
        path: /home/{{ deploy_user }}/bankservice
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0755'


    - name: Set timezone to MSK
      timezone:
        name: Europe/Moscow

    - name: Display completion message
      debug:
        msg: |
          ✅ Server setup complete for BankService!

          Next steps:
          1. Deploy application: ansible-playbook -i inventory/hosts.yml playbooks/deploy-backend.yml --ask-vault-pass
          2. SSH as deploy user: ssh {{ deploy_user }}@{{ ansible_host }}
          3. Check Docker: docker ps

          Server details:
          - Deploy user: {{ deploy_user }}
          - Deploy directory: /home/{{ deploy_user }}/bankservice
          - Docker version: installed
          - Docker Compose version: {{ compose_version.stdout }}
