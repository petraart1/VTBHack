---
- name: Update BankService Secrets
  hosts: production, staging
  become: yes
  vars_files:
    - ../inventory/group_vars/vault.yml

  tasks:
    - name: Update .env file with latest secrets
      template:
        src: ../templates/env.j2
        dest: "{{ deploy_dir }}/.env"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0600'
      no_log: true
      register: env_updated

    - name: Restart BankService container to apply new secrets
      command: docker-compose restart bankservice
      args:
        chdir: "{{ deploy_dir }}"
      become_user: "{{ deploy_user }}"
      environment:
        COMPOSE_PROJECT_NAME: "{{ compose_project_name }}"
      when: env_updated.changed

    - name: Wait for service to restart with new secrets
      uri:
        url: http://localhost:8081/actuator/health
        method: GET
        status_code: 200
      register: health_check
      retries: "{{ health_check_retries }}"
      delay: "{{ health_check_delay }}"
      until: health_check.status == 200
      when: env_updated.changed

    - name: Display update result
      debug:
        msg: "✅ Secrets updated and BankService restarted successfully"
      when: env_updated.changed

    - name: Display no changes message
      debug:
        msg: "ℹ️ No secret changes detected, nothing to update"
      when: not env_updated.changed
