---
- name: Setup HashiCorp Vault
  hosts: production, staging
  become: yes

  vars:
    vault_version: "1.15.0"
    vault_port: 8200

  tasks:
    - name: Download Vault binary
      get_url:
        url: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_amd64.zip"
        dest: "/tmp/vault_{{ vault_version }}.zip"

    - name: Extract Vault
      unarchive:
        src: "/tmp/vault_{{ vault_version }}.zip"
        dest: "/usr/local/bin/"
        remote_src: yes

    - name: Create Vault user
      user:
        name: vault
        shell: /bin/bash
        system: yes

    - name: Create Vault directories
      file:
        path: "{{ item }}"
        state: directory
        owner: vault
        group: vault
        mode: '0755'
      loop:
        - /etc/vault
        - /var/lib/vault
        - /var/log/vault

    - name: Create Vault config
      template:
        src: ../templates/vault.hcl.j2
        dest: /etc/vault/vault.hcl
        owner: vault
        group: vault
        mode: '0644'

    - name: Create systemd service
      template:
        src: ../templates/vault.service.j2
        dest: /etc/systemd/system/vault.service
        owner: root
        group: root
        mode: '0644'

    - name: Enable Vault service
      systemd:
        name: vault
        enabled: yes
        state: started

    - name: Wait for Vault to be ready
      uri:
        url: "http://localhost:{{ vault_port }}/v1/sys/health"
        method: GET
        status_code: 200
      retries: 30
      delay: 2

    - name: Initialize Vault (only if not initialized)
      uri:
        url: "http://localhost:{{ vault_port }}/v1/sys/init"
        method: PUT
        body_format: json
        body:
          secret_shares: 1
          secret_threshold: 1
        status_code: [200, 400]  # 400 if already initialized
      register: vault_init

    - name: Display Vault initialization info
      debug:
        msg: |
          Vault initialized!
          Root Token: {{ vault_init.json.root_token }}
          Unseal Key: {{ vault_init.json.keys[0] }}

          ⚠️  SAVE THESE VALUES SECURELY! ⚠️
      when: vault_init.status == 200

    - name: Unseal Vault
      uri:
        url: "http://localhost:{{ vault_port }}/v1/sys/unseal"
        method: PUT
        body_format: json
        body:
          key: "{{ vault_init.json.keys[0] }}"
        status_code: 200
      when: vault_init.status == 200
