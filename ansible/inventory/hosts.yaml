# BankService Ansible Inventory
# Определяет серверы для backend deployment

all:
  children:
    # Production environment - backend only
    production:
      hosts:
        backend-prod:
          ansible_host: YOUR_SERVER_IP  # Замените на реальный IP
          ansible_user: deploy
          ansible_ssh_private_key_file: ~/.ssh/deploy_key
          ansible_python_interpreter: /usr/bin/python3
          server_role: backend
          environment: production

    # Staging environment - backend only
    staging:
      hosts:
        backend-staging:
          ansible_host: YOUR_STAGING_IP  # Замените на реальный IP
          ansible_user: deploy
          ansible_ssh_private_key_file: ~/.ssh/deploy_key
          ansible_python_interpreter: /usr/bin/python3
          server_role: backend
          environment: staging
