# Зашифрованные секреты для BankService
# Создать: ansible-vault create ansible/inventory/group_vars/vault.yml
# Редактировать: ansible-vault edit ansible/inventory/group_vars/vault.yml
---

# Production Database
vault_db_url: "jdbc:postgresql://postgres:5432/banking_db"
vault_db_user: "postgres"
vault_db_password: "your-production-db-password"

# Production JWT Secret (минимум 256 символов)
vault_jwt_secret: "your-production-jwt-secret-key-must-be-at-least-256-characters-long-here"

# Production Redis
vault_redis_password: "your-production-redis-password"

# Production Open Banking API Keys
vault_vbank_api_url: "https://vbank.open.bankingapi.ru"
vault_vbank_api_key: "your-production-vbank-api-key"
vault_tbank_api_url: "https://tbank.open.bankingapi.ru"
vault_tbank_api_key: "your-production-tbank-api-key"
vault_sberbank_api_url: "https://sberbank.open.bankingapi.ru"
vault_sberbank_api_key: "your-production-sberbank-api-key"

# Staging Database
vault_staging_db_url: "jdbc:postgresql://postgres:5432/banking_db_staging"
vault_staging_db_user: "postgres"
vault_staging_db_password: "your-staging-db-password"

# Staging JWT Secret
vault_staging_jwt_secret: "your-staging-jwt-secret-key-must-be-at-least-256-characters-long-here"

# Staging Redis
vault_staging_redis_password: "your-staging-redis-password"

# Staging Open Banking API Keys (test/sandbox keys)
vault_staging_vbank_api_url: "https://sandbox-vbank.open.bankingapi.ru"
vault_staging_vbank_api_key: "your-staging-vbank-api-key"
vault_staging_tbank_api_url: "https://sandbox-tbank.open.bankingapi.ru"
vault_staging_tbank_api_key: "your-staging-tbank-api-key"
vault_staging_sberbank_api_url: "https://sandbox-sberbank.open.bankingapi.ru"
vault_staging_sberbank_api_key: "your-staging-sberbank-api-key"
