# Staging Environment Variables for BankService
---
# Docker Registry Configuration (GitHub Container Registry)
registry_url: ghcr.io
registry_username: "{{ lookup('env', 'GITHUB_ACTOR') }}"
registry_password: "{{ lookup('env', 'GITHUB_TOKEN') }}"
registry_prefix: "your-org/bankservice"  # Замените на ваш organization

# Project Configuration
project_name: bankservice
deploy_user: deploy
deploy_dir: /home/deploy/bankservice-staging
compose_project_name: bank_staging

# Service Version (develop branch для staging)
service_version: "{{ lookup('env', 'GITHUB_SHA') | default('develop') }}"

# Environment Variables (staging секреты из vault.yml)
env_vars:
  # Database (staging)
  DB_URL: "{{ vault_staging_db_url }}"
  DB_USER: "{{ vault_staging_db_user }}"
  DB_PASSWORD: "{{ vault_staging_db_password }}"

  # JWT Configuration
  JWT_SECRET: "{{ vault_staging_jwt_secret }}"
  JWT_EXPIRATION_MS: "900000"

  # Redis Configuration
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "{{ vault_staging_redis_password }}"

  # Open Banking APIs (staging/test keys)
  VBANK_API_URL: "{{ vault_staging_vbank_api_url }}"
  VBANK_API_KEY: "{{ vault_staging_vbank_api_key }}"
  TBANK_API_URL: "{{ vault_staging_tbank_api_url }}"
  TBANK_API_KEY: "{{ vault_staging_tbank_api_key }}"
  SBERBANK_API_URL: "{{ vault_staging_sberbank_api_url }}"
  SBERBANK_API_KEY: "{{ vault_staging_sberbank_api_key }}"

  # Spring Profiles
  SPRING_PROFILES_ACTIVE: "staging"

  # Logging (более verbose для debugging)
  LOGGING_LEVEL_ROOT: "DEBUG"
  LOGGING_LEVEL_COM_BANK: "DEBUG"

# Health Check Configuration (более мягкие для staging)
health_check_retries: 5
health_check_delay: 5
health_check_timeout: 3
