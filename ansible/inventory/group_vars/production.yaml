---
# Production Environment Variables
registry_url: ghcr.io
registry_prefix: petraart1/vtbhack
project_name: vtbhack
deploy_user: deploy
deploy_dir: /opt/services
compose_project_name: vtbhack_prod

# Service versions (обновляются GitHub Actions)
authService_version: "main-latest"
bankService_version: "main-latest"
radarService_version: "main-latest"

# Database config
postgres_db: vtbhack_db
postgres_user: vtbhack

# Redis
redis_host: redis
redis_port: 6379

# Health checks
health_check_retries: 30
health_check_delay: 2

# Service ports
auth_port: 8080
bank_port: 8081
radar_port: 8082

# Logging
logging_level_root: "INFO"
spring_profiles_active: "production"

# Service inter-communication
auth_url: "http://auth:8080"
bank_url: "http://bank:8081"
radar_url: "http://radar:8082"

# Registry auth (используются из env)
registry_username: "{{ lookup('env', 'GITHUB_ACTOR') }}"
registry_password: "{{ lookup('env', 'GITHUB_TOKEN') }}"
