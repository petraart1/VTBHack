[defaults]
# Inventory file location
inventory = inventory/hosts.yaml

# Remote user
remote_user = vm_0

# Disable host key checking (production should verify)
host_key_checking = False

# Enable pipelining for faster execution
pipelining = True

# Use the YAML callback plugin for better output
stdout_callback = yaml

# Log playbook executions
log_path = ./ansible.log

# Vault password file (optional)
# vault_password_file = ~/.ansible_vault_pass

# Retry files location
retry_files_enabled = True
retry_files_save_path = ./retry

# SSH timeout
timeout = 30

# Gathering facts
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostChecking=no
control_path = /tmp/ansible-ssh-%%h-%%p-%%r