spring:
  application:
    name: bankService

  datasource:
    url: jdbc:postgresql://${BANK_DB_CONTAINER_NAME}:${DB_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # HikariCP Connection Pool оптимизация для высокой нагрузки
    hikari:
      # Основные настройки пула
      maximum-pool-size: 20          # Максимум 20 соединений (увеличено для высокой нагрузки)
      minimum-idle: 5               # Минимум 5 простаивающих соединений
      idle-timeout: 300000          # 5 минут до закрытия простаивающего соединения
      max-lifetime: 1200000         # 20 минут максимальное время жизни соединения
      connection-timeout: 20000     # 20 секунд таймаут на получение соединения

      # Настройки валидации соединений
      validation-timeout: 5000      # 5 секунд на валидацию
      leak-detection-threshold: 60000  # 60 секунд для обнаружения утечек
      connection-test-query: SELECT 1  # Простой тест соединения

      # Оптимизации производительности
      pool-name: BankServicePool    # Имя пула для мониторинга
      allow-pool-suspension: false  # Запретить приостановку пула
      auto-commit: true             # Автоматический commit (по умолчанию)

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 2000ms
    lettuce:
      pool:
        # Redis connection pool оптимизация
        max-active: 20           # Максимум 20 активных соединений
        max-idle: 10             # Максимум 10 простаивающих соединений
        min-idle: 5              # Минимум 5 простаивающих соединений
        max-wait: 3000ms         # Максимум 3 секунды ожидания соединения
        time-between-eviction-runs: 60000ms  # Проверка каждые 60 секунд
      shutdown-timeout: 100ms

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
    
jwt:
  issuer: com.bank.auth
  secret: ${JWT_SECRET:34cf09cbe5571911e487cafcd49b72946a133fe881c3de75ab2d412f226ef06f}

logging:
  level:
    com:
      bank:
        controller: INFO
        service: DEBUG
    org:
      springframework: WARN
      liquibase: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# OpenAPI / Swagger конфигурация
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  show-actuator: true

# Конфигурация внешних банковских API
bank:
  configs:
    vbank:
      name: "VBank"
      baseUrl: "https://vbank.open.bankingapi.ru"
      tokenEndpoint: "/auth/bank-token"
      accountsEndpoint: "/accounts"
      transactionsEndpoint: "/accounts/{accountId}/transactions"
      balancesEndpoint: "/accounts/{accountId}/balances"
      connectTimeout: 10000
      readTimeout: 30000
    abank:
      name: "ABank"
      baseUrl: "https://abank.open.bankingapi.ru"
      tokenEndpoint: "/auth/bank-token"
      accountsEndpoint: "/accounts"
      transactionsEndpoint: "/accounts/{accountId}/transactions"
      balancesEndpoint: "/accounts/{accountId}/balances"
      connectTimeout: 10000
      readTimeout: 30000
    sbank:
      name: "SBank"
      baseUrl: "https://sbank.open.bankingapi.ru"
      tokenEndpoint: "/auth/bank-token"
      accountsEndpoint: "/accounts"
      transactionsEndpoint: "/accounts/{accountId}/transactions"
      balancesEndpoint: "/accounts/{accountId}/balances"
      connectTimeout: 10000
      readTimeout: 30000

# Resilience4j конфигурация
resilience4j:
  retry:
    instances:
      bankApi:
        maxAttempts: 3
        waitDuration: 1000ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
          - reactor.core.Exceptions$ReactiveException
        ignoreExceptions:
          - com.bank.exception.BankApiException

  circuitbreaker:
    instances:
      bankApi:
        # Основные настройки
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50

        # Дополнительные настройки
        eventConsumerBufferSize: 10
        recordExceptions:
          - com.bank.exception.BankApiException
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - reactor.core.Exceptions$ReactiveException
        ignoreExceptions:
          - java.lang.IllegalArgumentException

  # Метрики для мониторинга
  metrics:
    enable:
      circuitbreaker: true
      retry: true
    tags:
      application: bankService

# Actuator endpoints для мониторинга
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,resilience4j,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true  # Включает liveness и readiness probes для Kubernetes
    metrics:
      enabled: true
    resilience4j:
      enabled: true
    loggers:
      enabled: true
  health:
    circuitbreakers:
      enabled: true
    # Настройки для кастомных health checks
    custom:
      enabled: true