# Redis configuration for development
bind 0.0.0.0
port 6379

# Memory management
maxmemory 128mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
logfile ""

# Security (for development only)
protected-mode no

# Performance
tcp-keepalive 300
timeout 0

