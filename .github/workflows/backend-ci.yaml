name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: petraart1/vtbhack

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: 
          - name: authService
            skip_tests: true
          - name: bankService
            skip_tests: false
          - name: radarService
            skip_tests: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: backend/${{ matrix.service.name }}
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: backend/${{ matrix.service.name }}
        run: ./gradlew clean build -x test --info

      - name: Run tests
        if: ${{ !matrix.service.skip_tests }}
        working-directory: backend/${{ matrix.service.name }}
        run: ./gradlew test --info
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service.name }}
          path: backend/${{ matrix.service.name }}/build/libs/*.jar
          retention-days: 1

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service: [authService, bankService, radarService]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Convert service name to lowercase
        id: service_lower
        run: |
          SERVICE_LOWER=$(echo "${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')
          echo "service_lower=$SERVICE_LOWER" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: backend/${{ matrix.service }}/build/libs/

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ steps.service_lower.outputs.service_lower }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ steps.service_lower.outputs.service_lower }}:${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            JAR_FILE=build/libs/*.jar

  deploy-ansible:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.radarsubscriptions.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PRODUCTION_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create Ansible Vault password file
        run: |
          mkdir -p ~/.ansible
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ~/.ansible_vault_pass
          chmod 600 ~/.ansible_vault_pass

      - name: Update service versions in production.yaml
        run: |
          IMAGE_TAG="${{ github.ref_name }}-${{ github.sha }}"
          PROD_FILE="ansible/inventory/group_vars/production.yaml"
          
          sed -i "s/authService_version: .*/authService_version: \"$IMAGE_TAG\"/" "$PROD_FILE"
          sed -i "s/bankService_version: .*/bankService_version: \"$IMAGE_TAG\"/" "$PROD_FILE"
          sed -i "s/radarService_version: .*/radarService_version: \"$IMAGE_TAG\"/" "$PROD_FILE"

      - name: Run Ansible playbook
        run: |
          ansible-playbook \
          -i ansible/inventory/hosts.yaml \
          ansible/playbooks/deploy-backend.yaml \
          --vault-password-file ~/.ansible_vault_pass \
          --limit production \
          -vv
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          ANSIBLE_CONFIG: ansible/ansible.cfg


      - name: Verify deployment
        run: |
          echo "🔍 Checking services..."
          
          for port in 8080 8081 8082; do
            echo "Checking port $port..."
            for i in {1..30}; do
              if curl -sf http://${{ secrets.PRODUCTION_SERVER_IP }}:$port/actuator/health > /dev/null 2>&1; then
                echo "✅ Service on port $port is healthy"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "❌ Service on port $port failed"
                exit 1
              fi
              sleep 2
            done
          done
          
          echo "✅ All services are healthy!"
