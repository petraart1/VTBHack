name: Backend CI/CD 

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # Job 1: Build и Test
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [authService, bankService, radarService]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        working-directory: backend/${{ matrix.service }}
        run: chmod +x gradlew
      
      - name: Build with Gradle
        working-directory: backend/${{ matrix.service }}
        run: ./gradlew clean build -x test
      
      - name: Run tests
        working-directory: backend/${{ matrix.service }}
        run: ./gradlew test
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: backend/${{ matrix.service }}/build/reports/tests/

  # Job 2: Security Scan
  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend/'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 3: Build и Push Docker Images
  docker-build-push:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [authService, bankService, radarService]
    
    permissions:
      contents: read
      packages: write
    
    outputs:
      auth_service_tag: ${{ steps.meta-auth.outputs.version }}
      bank_service_tag: ${{ steps.meta-bank.outputs.version }}
      radar_service_tag: ${{ steps.meta-radar.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta-${{ matrix.service }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta-${{ matrix.service }}.outputs.tags }}
          labels: ${{ steps.meta-${{ matrix.service }}.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 4: Deploy with Ansible
  deploy-ansible:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.radarsubscriptions.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
      
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PRODUCTION_SERVER_IP }} >> ~/.ssh/known_hosts
      
      - name: Create Ansible Vault password file
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ~/.ansible_vault_pass
          chmod 600 ~/.ansible_vault_pass
      
      - name: Update service versions in inventory
        run: |
          sed -i "s/auth_service: .*/auth_service: \"${{ github.ref_name }}-${{ github.sha }}\"/" \
            ansible/inventory/group_vars/production.yml
          sed -i "s/bank_service: .*/bank_service: \"${{ github.ref_name }}-${{ github.sha }}\"/" \
            ansible/inventory/group_vars/production.yml
          sed -i "s/radar_service: .*/radar_service: \"${{ github.ref_name }}-${{ github.sha }}\"/" \
            ansible/inventory/group_vars/production.yml
      
      - name: Run Ansible playbook
        run: |
          ansible-playbook \
            -i ansible/inventory/hosts.yml \
            ansible/playbooks/deploy-backend.yml \
            --vault-password-file ~/.ansible_vault_pass \
            -e "github_token=${{ secrets.GITHUB_TOKEN }}" \
            -e "github_actor=${{ github.actor }}" \
            --limit production
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
      
      - name: Verify deployment
        run: |
          
          # Health check for all services
          echo "🔍 Checking all services..."
          curl -f http://${{ secrets.PRODUCTION_SERVER_IP }}:8080/actuator/health || exit 1
          curl -f http://${{ secrets.PRODUCTION_SERVER_IP }}:8081/actuator/health || exit 1
          curl -f http://${{ secrets.PRODUCTION_SERVER_IP }}:8082/actuator/health || exit 1

          echo "✅ All services (auth:8080, bank:8081, radar:8082) are healthy!"
