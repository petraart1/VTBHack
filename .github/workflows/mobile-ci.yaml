name: Build Mobile App

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'mobile/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # для создания релизов

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true  # загружаем образ локально для использования
          tags: android-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build APK
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/mobile:/app/mobile \
            -v gradle_cache:/app/.gradle \
            android-builder:latest

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: mobile/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
